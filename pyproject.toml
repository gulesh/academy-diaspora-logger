[build-system]
requires = ["setuptools>=64.0"]
build-backend = "setuptools.build_meta"

[project]
name = "academy-diaspora-logger"
version = "1.0.3"
description = "Academy LogConfig that ships agent logs to Diaspora/Kafka, with support for Globus Compute remote execution"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Gulesh Shukla", email = "gshukla14@uchicago.edu"},
    {name = "Haochen Pan", email = "haochenpan@uchicago.edu"},
]
maintainers = [
    {name = "Gulesh Shukla", email = "gshukla14@uchicago.edu"},
]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: Implementation :: CPython",
]
dependencies = [
    "academy-py>=0.3.1",
    "certifi",
    # 0.4.7 added diaspora_event_sdk.sdk.auth (used by `diaspora setup`);
    # 0.4.8 capped its kafka-python extra below 3.
    "diaspora-event-sdk[kafka-python]>=0.4.8",
    "kafka-python<3",
]

[project.scripts]
diaspora = "diaspora:main"

[tool.setuptools]
py-modules = ["diaspora_logger", "diaspora_context", "diaspora", "diaspora_auth"]
